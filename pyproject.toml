[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scMM"
version = "0.2.0"
description = "Single-cell mass spectrometry data processing and analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "scMM contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyopenms>=3.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
    "palantir>=1.3",
    "seaborn>=0.13",
    "umap-learn>=0.5",
]
cluster = [
    "leidenalg>=0.10",
    "networkx>=3.2",
    "python-igraph>=0.11",
]
ui = [
    "panel>=1.8,<2",
    "plotly>=6,<7",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
scmm-process = "scMM.cli:main"
scmm-ui = "scMM.ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scMM*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scMM"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "LOG", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scMM/plot/_trajectory.py" = ["E741"]
"scMM/ui/app.py" = ["RUF001"]
