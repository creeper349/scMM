[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scMM"
version = "0.3.0"
description = "CyESI single-cell mass-spectrometry data processing"
requires-python = ">=3.10"
authors = [
    {name="SCMM developers"}
]
dependencies = [
    "adjustText>=1.3",
    "anndata>=0.10",
    "decorator>=5.1",
    "joblib>=1.3",
    "igraph==1.0.0",
    "leidenalg==0.12.0",
    "matplotlib>=3.7",
    "matplotlib-venn>=1.1",
    "networkx>=3.0",
    "numpy>=1.25",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyopenms>=3.0",
    "pygoslin>=2.2.5,<3",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
    "tqdm>=4.65",
    "umap-learn>=0.5",
    "upsetplot>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["imbalanced-learn>=0.13", "shap>=0.48"]
web = ["streamlit>=1.40", "plotly>=5.24"]
thermo = ["pythonnet>=3.0,<4.0"]

[project.scripts]
scmm = "scMM.cli:main"
scmm-web = "scMM.webapp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scMM", "scMM.*"]
exclude = ["build*", "dist*", "packaging*", "tests*"]
namespaces = false

[tool.setuptools.package-data]
scMM = ["config/*.json", "components/matrix_table/*.html", "components/annotation_table/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "build-cache-old", "dist"]
